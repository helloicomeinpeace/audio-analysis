services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-analysis-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - audio-net

  webserver:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: audio-analysis-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - audio-net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio-analysis-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --queue=default --tries=3 --sleep=3 --timeout=120
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      mongodb:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - audio-net

  mongodb:
    image: mongo:7
    container_name: audio-analysis-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - audio-net

volumes:
  mongo-data:
  app-storage:

networks:
  audio-net:
    driver: bridge
